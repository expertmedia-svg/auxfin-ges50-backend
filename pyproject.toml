[project]
name = "ges-g50-sync-control"
version = "0.1.0"
description = "GES G50 - Controle des synchronisations eCoach"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.9",
    "celery>=5.4",
    "redis>=5.1",
    "opencv-python-headless>=4.10",
    "easyocr>=1.7.2",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "rapidfuzz>=3.10",
    "dateparser>=1.2.0",
    "reportlab>=4.2.5",
    "ffmpeg-python>=0.2.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 130
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008 : FastAPI utilise intentionnellement Depends(...)/File(...) comme valeur
# par defaut des parametres de route (pattern impose par le framework).
# UP042 : (str, enum.Enum) est garde plutot que enum.StrEnum pour la
# compatibilite de serialisation JSON/SQLAlchemy utilisee dans tout le projet.
ignore = ["B008", "UP042"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
